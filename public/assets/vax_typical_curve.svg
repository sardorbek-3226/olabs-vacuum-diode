<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#ffffff" rx="12"/>
  <rect x="8" y="8" width="684" height="424" fill="none" stroke="#e2e8f0" stroke-width="2" rx="10"/>

  <text x="350" y="32" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">
    2-rasm. Vakuumli diod volt-amper xarakteristikasining (VAX) tipik shakli
  </text>

  <g stroke="#f1f5f9" stroke-width="1">
    <line x1="80" y1="360" x2="640" y2="360"/>
    <line x1="80" y1="300" x2="640" y2="300"/>
    <line x1="80" y1="240" x2="640" y2="240"/>
    <line x1="80" y1="180" x2="640" y2="180"/>
    <line x1="80" y1="120" x2="640" y2="120"/>
    <line x1="80" y1="60" x2="640" y2="60"/>

    <line x1="160" y1="50" x2="160" y2="370"/>
    <line x1="240" y1="50" x2="240" y2="370"/>
    <line x1="320" y1="50" x2="320" y2="370"/>
    <line x1="400" y1="50" x2="400" y2="370"/>
    <line x1="480" y1="50" x2="480" y2="370"/>
    <line x1="560" y1="50" x2="560" y2="370"/>
  </g>

  <!-- O'qlar -->
  <line x1="80" y1="360" x2="650" y2="360" stroke="#0f172a" stroke-width="2"/>
  <polygon points="650,356 660,360 650,364" fill="#0f172a"/>
  <text x="650" y="385" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#0f172a">U_A (V)</text>

  <line x1="140" y1="375" x2="140" y2="45" stroke="#0f172a" stroke-width="2"/>
  <polygon points="136,45 140,35 144,45" fill="#0f172a"/>
  <text x="95" y="45" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#0f172a">I_A (mA)</text>

  <text x="130" y="375" font-family="Inter, sans-serif" font-size="12" fill="#64748b" text-anchor="end">0</text>
  <text x="105" y="375" font-family="Inter, sans-serif" font-size="11" fill="#dc2626" text-anchor="middle">-U_A</text>

  <!-- ZONALAR -->
  <rect x="140" y="50" width="160" height="310" fill="#38bdf8" opacity="0.08"/>
  <rect x="300" y="50" width="130" height="310" fill="#f59e0b" opacity="0.08"/>
  <rect x="430" y="50" width="210" height="310" fill="#10b981" opacity="0.08"/>

  <line x1="300" y1="50" x2="300" y2="360" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="430" y1="50" x2="430" y2="360" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>

  <text x="220" y="75" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#0284c7" text-anchor="middle">
    I. Xajmiy zaryad sohasi
  </text>
  <text x="220" y="92" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#0369a1" text-anchor="middle">
    I_A = K • U_A^(3/2)
  </text>

  <text x="365" y="75" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#d97706" text-anchor="middle">
    II. O'tish sohasi
  </text>

  <text x="535" y="75" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#059669" text-anchor="middle">
    III. To'yinish sohasi
  </text>
  <text x="535" y="92" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#047857" text-anchor="middle">
    I_A = I_to'yinish (T)
  </text>

  <!-- 3 TA HARORAT UCHUN VAX EGRI CHIZIQLARI -->
  <!-- 1. T1 (4.0V) -->
  <path d="M 100 360 L 140 360 Q 200 355 240 320 Q 280 280 320 270 L 640 262" 
        fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  <text x="645" y="266" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#10b981">T_1 (4.0V)</text>

  <!-- 2. T2 (5.0V) -->
  <path d="M 100 360 L 140 360 Q 200 355 250 310 Q 310 240 380 190 Q 420 180 640 174" 
        fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
  <text x="645" y="178" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#2563eb">T_2 (5.0V)</text>

  <!-- 3. T3 (6.3V) -->
  <path d="M 100 360 L 140 360 Q 200 355 250 310 Q 320 230 400 140 Q 450 115 640 108" 
        fill="none" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round"/>
  <text x="645" y="112" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#dc2626">T_3 (6.3V)</text>

  <rect x="80" y="358" width="60" height="4" fill="#dc2626"/>
  <text x="110" y="395" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle">
    I_A = 0 (To'g'rilagich)
  </text>

  <text x="350" y="420" font-family="Inter, sans-serif" font-size="11" fill="#475569" text-anchor="middle">
    Katod haroratlari bog'liqligi: T_1 &lt; T_2 &lt; T_3 (Qizdirish kuchlanishlari U_f1 &lt; U_f2 &lt; U_f3)
  </text>
</svg>
